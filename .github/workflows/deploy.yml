name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files and embedded JavaScript syntax
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s icon.svg
          test -s apple-touch-icon.png
          test -s version.json
          python3 -m json.tool manifest.webmanifest >/dev/null
          node --check sw.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          page = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', page)
          assert scripts, "No embedded game script found"
          Path('/tmp/rico-game.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/rico-game.js
          node tests/blue-ai-regression.cjs
          node tests/net-and-touch-regression.cjs
          node tests/touch-slider-and-rally-regression.cjs
          node tests/mobile-hud-and-timers-regression.cjs
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html').read_text()
          draw = page.split('function draw(){', 1)[1].split('function resizeCourt()', 1)[0]
          assert 'drawBall();' in draw, "Ball must be rendered every frame"
          assert 'function drawBall()' in page, "Ball drawing function missing"
          assert 'ball.y<ball.r+8' in draw, "Offscreen ball marker missing"
          assert 'Dynamic Island' in page, "iPhone portrait safe-area layout missing"
          assert 'function serveReset(side=' in page, "Winner-side serve reset missing"
          collide = page.split('function collide(p){', 1)[1].split('function tick(dt)', 1)[0]
          assert 'const approach=relX*nx+relY*ny' in collide, "Angle-aware bounce missing"
          assert 'const reflectedX=' in collide and 'const reflectedY=' in collide, "Surface reflection missing"
          assert 'const direction=p===red?1:-1' not in collide, "Unfair fixed-direction shots found"
          ai = page.split("function tick(dt){", 1)[1].split("move(blue,dir,jump,dt);", 1)[0]
          assert "const serveTarget=clampBlue(ball.x+offset)" in ai, "CPU angled serve positioning missing"
          assert "let target=clampBlue(defensiveX+positionOffset)" in ai, "Near-net interception target missing"
          assert "const nearNet=" in ai and "const groundT=" in ai, "Near-net landing prediction missing"
          assert "const ballTooHighForStanding=" in ai, "Grounded defense guard missing"
          assert "cpuJumpPlan={at:" in ai, "Predictive airborne jump scheduling missing"
          assert "cpuJumpCooldown" in ai and "cpuJumpArmed" in ai, "CPU bounce-loop protection missing"
          assert 'const LEARN_KEY=' in page, "AI storage missing"
          assert 'function learnFromRally(result)' in page, "Outcome learning missing"
          assert "learning.positionBias*adaptiveStrength" in ai, "Adaptive positioning inactive"
          assert "learning.jumpBias*adaptiveStrength" in ai, "Adaptive jump timing inactive"
          assert "resetLearning" in page, "Learning reset unavailable"
          PY
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp deployment version automatically
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = os.environ['DEPLOY_SHA'][:12]
          page = Path('index.html')
          html = page.read_text()
          html, count = re.subn(r"const APP_VERSION='[^']+';", "const APP_VERSION='" + version + "';", html, count=1)
          if count != 1:
              raise SystemExit("Missing automatic update version marker")
          page.write_text(html)
          Path('version.json').write_text(json.dumps({"version": version}) + "\n")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for GitHub Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 15); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[]? | select(.name == "github-pages")] | length' 2>/dev/null || echo 0)
            if [ "$count" != "0" ]; then
              echo "GitHub Pages artifact is ready."
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/15)..."
            sleep 4
          done
          echo "::error::GitHub Pages artifact metadata was not available after retries."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4