   samples:clamp(Math.floor(Number(data.samples)||0),0,100000),
   returns:clamp(Math.floor(Number(data.returns)||0),0,100000),
   misses:clamp(Math.floor(Number(data.misses)||0),0,100000),

// Updates are checked on launch, resume and periodically, but never interrupt a match.
const APP_VERSION='1.8.0';
let pendingVersion=null,checkingUpdate=false,lastUpdateCheck=0;
function applyPendingUpdate(){
 if(!pendingVersion)return false;
 const marker='rico-blobby-reloaded-'+pendingVersion;
 try{if(sessionStorage.getItem(marker)==='1'){pendingVersion=null;return false}
 sessionStorage.setItem(marker,'1')}catch{}
 window.location.reload();return true;
}
async function checkForUpdates(){
 if(checkingUpdate||!navigator.onLine)return;
 checkingUpdate=true;
 try{
  const response=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});
  if(!response.ok)return;
  const latest=await response.json();
  if(typeof latest.version!=='string'||latest.version===APP_VERSION)return;
  pendingVersion=latest.version;
  if('serviceWorker'in navigator){const registration=await navigator.serviceWorker.getRegistration();if(registration)await registration.update()}
  if(!running||!$('overlay').hidden){applyPendingUpdate()}else{
   $('status').textContent='Update ready';
  }
 }catch{}finally{checkingUpdate=false}
}
function maybeCheck(){const now=Date.now();if(now-lastUpdateCheck<15000)return;lastUpdateCheck=now;checkForUpdates()}
window.addEventListener('pageshow',maybeCheck);
window.addEventListener('online',maybeCheck);
window.addEventListener('focus',maybeCheck);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)maybeCheck()});
setInterval(()=>{if(!document.hidden)maybeCheck()},15*60*1000);
resizeCourt();renderBackdrop();serveReset();restoreSavedMatch();requestAnimationFrame(loop);maybeCheck();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
